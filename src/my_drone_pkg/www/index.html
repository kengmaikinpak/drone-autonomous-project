<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Roslibjs -->
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-100 h-screen overflow-hidden">

    <div class="flex h-full">
        <!-- Sidebar -->
        <aside class="w-80 bg-white shadow-xl z-20 flex flex-col border-r border-slate-200">
            <!-- Header -->
            <div class="p-4 border-b border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="chevron-left" class="w-5 h-5 text-slate-400 cursor-pointer"></i>
                        <span class="font-bold text-slate-700">DRONE</span>
                        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                    </div>
                    <button
                        class="text-[10px] font-bold border border-blue-500 text-blue-500 px-2 py-1 rounded hover:bg-blue-50 transition">SEARCH</button>
                </div>
                <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-widest">Holybro X500 V2</p>
            </div>

            <!-- Scrollable Content -->
            <div class="flex-1 overflow-y-auto sidebar-scroll p-4 space-y-6">

                <!-- STATUS -->
                <section>
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4">Current Status</h3>
                    <div class="grid grid-cols-3 gap-4 mb-4">
                        <div>
                            <p class="text-[10px] text-slate-400 uppercase font-bold flex items-center gap-1">
                                <i data-lucide="gauge" class="w-3 h-3"></i> Speed
                            </p>
                            <p class="text-sm font-bold text-slate-700"><span id="val-speed">0</span> <span
                                    class="text-[10px]">km/h</span></p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-400 uppercase font-bold flex items-center gap-1">
                                <i data-lucide="arrow-up" class="w-3 h-3"></i> Height
                            </p>
                            <p class="text-sm font-bold text-slate-700"><span id="val-height">0</span> <span
                                    class="text-[10px]">m</span></p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-400 uppercase font-bold flex items-center gap-1">
                                <i data-lucide="clock" class="w-3 h-3"></i> Time
                            </p>
                            <p class="text-sm font-bold text-slate-700" id="val-time">--:--</p>
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-[11px]">
                        <div class="flex items-center gap-1">
                            <i data-lucide="battery" class="w-4 h-4 text-green-500"></i>
                            <span class="font-bold text-green-500" id="val-battery">--%</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-slate-400 uppercase font-bold">Mode:</span>
                            <span class="font-bold text-blue-500 uppercase" id="val-mode">Waiting...</span>
                        </div>
                    </div>
                </section>

                <!-- HEALTH -->
                <section>
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4 border-t pt-4">Drone
                        Health</h3>
                    <div class="grid grid-cols-5 gap-2 text-center">
                        <div class="flex flex-col items-center gap-1">
                            <div class="p-2 bg-slate-50 rounded-full text-slate-400" id="health-gps"><i
                                    data-lucide="map-pin" class="w-4 h-4"></i></div>
                            <span class="text-[8px] font-bold uppercase">GPS</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <div class="p-2 bg-slate-50 rounded-full text-slate-400" id="health-wifi"><i
                                    data-lucide="wifi" class="w-4 h-4"></i></div>
                            <span class="text-[8px] font-bold uppercase">Wifi</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <div class="p-2 bg-slate-50 rounded-full text-slate-400" id="health-arm"><i
                                    data-lucide="shield-check" class="w-4 h-4"></i></div>
                            <span class="text-[8px] font-bold uppercase">Arm</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <div class="p-2 bg-slate-50 rounded-full text-slate-400" id="health-cpu"><i
                                    data-lucide="cpu" class="w-4 h-4"></i></div>
                            <span class="text-[8px] font-bold uppercase">CPU</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <div class="p-2 bg-slate-50 rounded-full text-slate-400" id="health-fcu"><i
                                    data-lucide="box" class="w-4 h-4"></i></div>
                            <span class="text-[8px] font-bold uppercase">FCU</span>
                        </div>
                    </div>
                </section>

                <!-- MISSION STATUS -->
                <section>
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-3 border-t pt-4">
                        Mission Status</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between text-[10px]">
                            <span class="text-slate-400 font-bold uppercase tracking-wider">Status</span>
                            <span class="text-blue-500 font-bold" id="mission-status">IDLE</span>
                        </div>
                        <div class="flex justify-between text-[10px]">
                            <span class="text-slate-400 font-bold uppercase tracking-wider">Distance</span>
                            <span class="text-slate-700 font-bold" id="val-dist">0.0 KM</span>
                        </div>
                    </div>
                </section>

                <!-- CONTROL BUTTONS -->
                <div class="pt-4 space-y-2">
                    <button id="btn-start-mission"
                        class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-blue-700 transition shadow-lg shadow-blue-200 uppercase tracking-widest disabled:bg-slate-300 disabled:shadow-none">
                        START MISSION
                    </button>
                    <div class="grid grid-cols-2 gap-2">
                        <!-- ใช้ปุ่ม Land เป็นปุ่มฉุกเฉินหรือจบภารกิจ -->
                        <button onclick="console.log('Emergency Stop (disabled)')"
                            class="bg-white border border-slate-200 text-slate-400 py-2 rounded-lg font-bold text-[10px] cursor-not-allowed uppercase tracking-widest">
                            Emergency Stop
                        </button>
                        <button id="btn-land"
                            class="bg-white border border-slate-200 text-slate-700 py-2 rounded-lg font-bold text-[10px] hover:bg-slate-50 uppercase tracking-widest text-red-500">
                            Cancel Mission
                        </button>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-slate-100 flex justify-between items-center">
                <div class="flex gap-4">
                    <button class="text-slate-400 hover:text-blue-500"><i data-lucide="home"
                            class="w-4 h-4"></i></button>
                    <button class="text-slate-400 hover:text-blue-500"><i data-lucide="settings"
                            class="w-4 h-4"></i></button>
                    <button class="text-slate-400 hover:text-blue-500"><i data-lucide="map"
                            class="w-4 h-4"></i></button>
                </div>
                <div id="ros-conn-indicator" class="flex items-center gap-1">
                    <span class="text-[9px] font-bold text-slate-400 uppercase">Connecting...</span>
                    <div class="w-2 h-2 rounded-full bg-slate-400 animate-pulse"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content (Map) -->
        <main class="flex-1 relative">
            <div
                class="absolute top-6 left-1/2 -translate-x-1/2 z-10 bg-white/90 backdrop-blur-sm px-6 py-2 rounded-full shadow-lg border border-white flex gap-10 items-center">
                <button class="text-[11px] font-bold text-blue-500 flex flex-col items-center gap-1 group">
                    <i data-lucide="plane" class="w-4 h-4"></i>
                    <span class="tracking-widest uppercase">Drones</span>
                </button>
                <button
                    class="text-[11px] font-bold text-slate-400 flex flex-col items-center gap-1 hover:text-slate-600 transition uppercase tracking-widest">
                    <i data-lucide="target" class="w-4 h-4"></i>
                    Mission
                </button>
            </div>

            <div id="map"></div>

            <div class="absolute bottom-6 right-6 z-10 space-y-2">
                <div
                    class="bg-white/90 backdrop-blur-sm p-3 rounded-xl shadow-lg border border-white flex flex-col gap-1 items-end">
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Coordinate</span>
                    <span class="text-[11px] font-mono font-bold text-slate-700" id="val-coords">0.0000, 0.0000</span>
                </div>
            </div>
        </main>
    </div>

    <!-- External Script -->
    <script src="script.js"></script>
</body>

</html>
