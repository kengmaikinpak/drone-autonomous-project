services:
    drone_app:
        build: .
        container_name: drone_jazzy
        network_mode: host
        privileged: true # เพื่อให้คุยกับ USB/Serial ได้
        devices:
            - /dev/ttyACM0:/dev/ttyACM0
            - /dev/ttyAMA0:/dev/ttyAMA0
        environment:
            - DISPLAY=${DISPLAY}
        volumes:
            - ./src:/ros2_ws/src
            - ./www:/ros2_ws/www
            - ./install:/ros2_ws/install
            - ./build:/ros2_ws/build
            - ./log:/ros2_ws/log
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
        tty: true
        stdin_open: true
        command: >
            /bin/bash -c "
            source /opt/ros/jazzy/setup.bash && 
            colcon build --symlink-install && 
            source install/setup.bash && 
            ros2 launch my_drone_pkg drone_mission.launch.py
            "
